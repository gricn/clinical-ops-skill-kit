<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Engineering Layers</title>
  <desc id="desc">Layered engineering architecture for the clinical ops skill kit, separating versioned capabilities from runtime data and governance controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .layer-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .layer-path { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #334155; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .caption { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 16; }
      .capability { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.4; rx: 16; }
      .runtime { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.4; rx: 16; }
      .safety { fill: #fff7ed; stroke: #fb923c; stroke-width: 1.4; rx: 16; }
      .governance { fill: #f5f3ff; stroke: #a78bfa; stroke-width: 1.4; rx: 16; }
      .line { fill: none; stroke: #334155; stroke-width: 1.5; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="48" y="54">Engineering Layers</text>
  <text class="subtitle" x="48" y="80">The project keeps agent instructions, executable skills, live data, credentials, and quality gates in separate layers.</text>

  <rect class="card" x="56" y="126" width="250" height="150"/>
  <text class="layer-title" x="80" y="160">Agent contract</text>
  <text class="layer-path" x="80" y="184">AGENTS.md</text>
  <text class="body" x="80" y="214">Repo-wide execution rules,</text>
  <text class="body" x="80" y="235">approval gates, closeout</text>
  <text class="body" x="80" y="256">standard, live-session hygiene.</text>

  <rect class="capability" x="382" y="126" width="250" height="150"/>
  <text class="layer-title" x="406" y="160">Skill catalog</text>
  <text class="layer-path" x="406" y="184">skills/catalog/</text>
  <text class="body" x="406" y="214">Functional collections,</text>
  <text class="body" x="406" y="235">entry skills, dependencies,</text>
  <text class="body" x="406" y="256">machine-readable mapping.</text>

  <rect class="capability" x="708" y="126" width="250" height="150"/>
  <text class="layer-title" x="732" y="160">Versioned skills</text>
  <text class="layer-path" x="732" y="184">skills/*/SKILL.md</text>
  <text class="body" x="732" y="214">Trigger rules, workflow steps,</text>
  <text class="body" x="732" y="235">failure modes, acceptance gates,</text>
  <text class="body" x="732" y="256">and reusable scripts.</text>

  <rect class="runtime" x="1034" y="126" width="190" height="150"/>
  <text class="layer-title" x="1058" y="160">Runtime</text>
  <text class="layer-path" x="1058" y="184">workspaces/</text>
  <text class="body" x="1058" y="214">Inputs, outputs, captures,</text>
  <text class="body" x="1058" y="235">browser profiles, local</text>
  <text class="body" x="1058" y="256">execution artifacts.</text>

  <path class="line" d="M306 201 H382"/>
  <path class="line" d="M632 201 H708"/>
  <path class="line" d="M958 201 H1034"/>

  <rect class="safety" x="80" y="356" width="342" height="174"/>
  <text class="layer-title" x="108" y="392">Safety and stability controls</text>
  <text class="body" x="108" y="424">1. Plan before high-risk live edits</text>
  <text class="body" x="108" y="448">2. Human approval before shipment actions</text>
  <text class="body" x="108" y="472">3. Read back after writes / clicks</text>
  <text class="body" x="108" y="496">4. Expose uncertainty instead of guessing</text>

  <rect class="runtime" x="470" y="356" width="342" height="174"/>
  <text class="layer-title" x="498" y="392">Data boundary</text>
  <text class="body" x="498" y="424">Versioned: skills, docs, governance</text>
  <text class="body" x="498" y="448">Gitignored: patient records, captures</text>
  <text class="body" x="498" y="472">Credential-only: secrets/</text>
  <text class="body" x="498" y="496">Synthetic fixtures for public demos</text>

  <rect class="governance" x="860" y="356" width="342" height="174"/>
  <text class="layer-title" x="888" y="392">Self-iteration loop</text>
  <text class="body" x="888" y="424">Operational failure or correction</text>
  <text class="body" x="888" y="448">-&gt; update SKILL / reference / script</text>
  <text class="body" x="888" y="472">-&gt; add regression or precommit gate</text>
  <text class="body" x="888" y="496">-&gt; future agents inherit the rule</text>

  <path class="line-soft" d="M833 276 C790 334 685 340 641 356"/>
  <path class="line-soft" d="M833 276 C855 334 963 340 1031 356"/>
  <path class="line-soft" d="M251 356 C270 318 448 298 507 276"/>

  <rect class="card" x="116" y="594" width="1048" height="58"/>
  <text class="caption" x="148" y="628">Portfolio message: complex clinical operations are automated through controlled workflows, not blind end-to-end autonomy.</text>
</svg>
